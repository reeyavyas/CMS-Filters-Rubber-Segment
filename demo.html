<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filter Bar Demo</title>
<style>
  /* Everything in this <style> stands in for classes you design in Webflow.
     The Filter Bar script adds behavior only; none of these values live in it. */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: linear-gradient(180deg, #0b2f47, #0e3b59); min-height: 100vh; }
  .page { max-width: 1440px; margin: 0 auto; padding: 48px 16px; }
  h2 { font: 700 24px Georgia, serif; margin: 48px 0 16px; }

  /* Bar */
  /* One element is both the bar and the options track. It's only as wide as it needs to be (700px minimum
     on desktop). The search field is its first item, so filters fill the rest of that line and any that don't
     fit wrap to the next line, starting under the search field. Filters keep their natural width.
     Padding 11px is the old bar (8px) plus track (3px), so the look is unchanged. */
  .filter-bar { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; row-gap: 8px; width: fit-content; max-width: 100%; margin: 0 auto; padding: 11px; border-radius: 10px; background: rgba(255,255,255,.12); --filter-focus: #fff; --filter-focus-offset: -2px; }
  /* Search starts at 240px and grows first (grow 1000) up to 400px with any room left on its line */
  .filter-search { position: relative; flex: 1000 0 240px; width: 400px; max-width: 400px; margin: 0 12px 0 0; }
  .filter-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #13232e; pointer-events: none; }
  .filter-input { width: 100%; height: 38px; margin: 0; padding: 0 12px 0 40px; border: 0; border-radius: 7px; font: 16px system-ui, sans-serif; color: #13232e; background: #fff; }
  .filter-input::placeholder { color: #56636c; }
  .filter-input:focus-visible { outline: 2px solid #13232e; outline-offset: -4px; }
  .filter-option { display: grid; place-items: center; padding: 8px 24px; font: 600 15px/22px system-ui, sans-serif; color: rgba(255,255,255,.82); text-decoration: none; white-space: nowrap; }
  /* Combo class for a bar without search: options share the bar's width evenly */
  .filter-option.is-spread { flex-grow: 1; }
  .filter-thumb { background: #fff; color: #0b2f47; border-radius: 7px; }
  .filter-status { margin: 24px 0 16px; font-size: 15px; color: rgba(255,255,255,.82); }
  .filter-empty { margin: 0 0 16px; font-size: 17px; }
  /* Webflow Desktop (992px and up) */
  @media (min-width: 992px) {
    .filter-bar { min-width: 700px; }
    .filter-option { padding-left: 48px; padding-right: 48px; }
  }
  /* Webflow Mobile portrait (478px and below): the only size where search gets its own line */
  @media (max-width: 478px) {
    .filter-bar { width: auto; justify-content: center; }
    .filter-search { flex-basis: 100%; width: auto; max-width: none; margin: 0; }
    .filter-option, .filter-option.is-spread { flex-grow: 0; padding-left: 4px; padding-right: 4px; }
  }

  /* Cards: your own grid and card design */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
  .card { display: flex; flex-direction: column; height: 100%; background: #fff; color: #13232e; border-radius: 24px; overflow: hidden; text-align: center; }
  .card-photo { aspect-ratio: 4 / 3; display: grid; place-items: center; background: linear-gradient(180deg, #fff, #b9d3e3); font: 700 48px Georgia, serif; color: #0b2f47; }
  .card-body { background: #fff; padding: 16px 16px 24px; display: grid; gap: 4px; justify-items: center; }
  .card-name { font: 700 22px Georgia, serif; margin: 0; }
  .card-title { margin: 0; color: #00706a; }
  .card-bar { margin-top: auto; padding: 12px 16px; background: #00706a; color: #fff; font-weight: 600; font-size: 18px; }
  .card-bar div + div { margin-top: 4px; }
  .event { background: #fff; color: #13232e; border-radius: 16px; padding: 20px; }
  .event-tag { display: inline-block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #00706a; text-transform: uppercase; letter-spacing: .04em; }
  .event h3 { margin: 0; font-size: 18px; }
  /* Pagination: your own design */
  .filter-range { margin: 0 0 16px; font-size: 15px; color: rgba(255,255,255,.82); }
  .pager { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-top: 32px; }
  .pager-pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .pager-page, .pager-step { display: grid; place-items: center; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 10px; color: #fff; font-weight: 600; text-decoration: none; }
  .pager-page:hover, .pager-step:hover { background: rgba(255,255,255,.12); }
  .pager-page.is-current { background: #fff; color: #0b2f47; }
  .pager-step.is-disabled { pointer-events: none; }
  .pager-gap { display: grid; place-items: center; min-width: 24px; height: 44px; color: rgba(255,255,255,.82); }
  .pager a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .hide { display: none; }
</style>
</head>
<body>
<main class="page">

  <!-- Example 1: advisors by state, with search and equal card heights. Sample people are made up. -->
  <div class="filter-bar" data-filter-bar="advisors" data-filter-options data-filter-label="Filter advisors by state">
    <form class="filter-search" onsubmit="return false">
      <label for="advisorSearch" class="hide">Search advisors</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="advisorSearch" class="filter-input" type="search" placeholder="Search by name or city" data-filter-search>
    </form>
    <a href="#" class="filter-option" data-filter-option>All</a>
    <div class="filter-thumb" data-filter-thumb></div>
  </div>
  <p class="filter-status" data-filter-status="advisors" data-filter-noun="advisor"></p>
  <p class="filter-empty" data-filter-empty="advisors">No advisors match. Try a different name, city or state.</p>

  <p class="filter-range" data-filter-range="advisors"></p>
  <div class="grid" role="list" id="advisorGrid"></div>

  <!-- Pagination: style every piece with your own classes -->
  <nav class="pager" data-filter-pagination="advisors" data-filter-page-size="12">
    <a href="#" class="pager-step" data-filter-prev>Previous</a>
    <div class="pager-pages" data-filter-pages>
      <a href="#" class="pager-page" data-filter-page>1</a>
      <span class="pager-gap" data-filter-page-gap>…</span>
    </div>
    <a href="#" class="pager-step" data-filter-next>Next</a>
  </nav>

  <script>
    // Demo only: stands in for a Webflow Collection List of 100 made-up advisors across 8 states.
    // Every 4th advisor also works in a second state, so state counts differ and some cards wrap.
    // Every 8th has two branches in that second city; data-filter-unique shows the city once.
    (() => {
      const first = ['Dana', 'Marcus', 'Priya', 'Tom', 'Elena', 'Grant', 'Keisha', 'Owen', 'Rosa', 'Felix'];
      const last = ['Whitfield', 'Oyelaran', 'Raman', 'Hollister', 'Vasquez', 'Pemberton', 'Monroe', 'Calder', 'Ibarra', 'Lindqvist'];
      const offices = [['Evansville, IN', 'Indiana'], ['Lexington, KY', 'Kentucky'], ['Murfreesboro, TN', 'Tennessee'], ['Columbus, OH', 'Ohio'], ['Springfield, IL', 'Illinois'], ['Atlanta, GA', 'Georgia'], ['Detroit, MI', 'Michigan'], ['Charlotte, NC', 'North Carolina']];
      const html = [];
      for (let i = 0; i < 100; i++) {
        const name = `${first[i % 10]} ${last[Math.floor(i / 10)]}`;
        const [city, state] = offices[i % offices.length], [alsoCity, alsoState] = offices[(i + 3) % offices.length];
        const also = i % 4 === 0;
        const title = i % 9 === 0 ? 'Wealth Advisor, Regional Manager' : 'Wealth Advisor';
        html.push(`<div role="listitem" data-filter-item="advisors"><div class="card">
          <div class="card-photo" data-fit-photo>${name.split(' ').map(w => w[0]).join('')}</div>
          <div class="card-body"><h3 class="card-name" data-filter-search-text data-fit-text>${name}</h3><p class="card-title" data-filter-search-text data-fit-text>${title}</p></div>
          <div class="card-bar" data-fit-grow><div data-filter-search-text data-fit-base>${city}</div>${also ? `<div class="w-dyn-list"><div role="list" class="w-dyn-items" data-filter-unique>${(i % 8 === 0 ? [1, 2] : [1]).map(() => `<div role="listitem" class="w-dyn-item"><div data-filter-search-text>Also ${alsoCity}</div></div>`).join('')}</div></div>` : ''}</div>
          <div class="hide"><span data-filter-value>${state}</span>${also && alsoState !== state ? `<span data-filter-value>${alsoState}</span>` : ''}</div>
        </div></div>`);
      }
      document.getElementById('advisorGrid').innerHTML = html.join('');
    })();
  </script>

  <!-- Example 2: the same component filtering events by category, in CMS order, with no search -->
  <h2>Events</h2>
  <div class="filter-bar" data-filter-bar="events" data-filter-sort="cms" data-filter-options data-filter-label="Filter events by type">
    <a href="#" class="filter-option" data-filter-option>All</a>
    <div class="filter-thumb" data-filter-thumb></div>
  </div>
  <p class="filter-status" data-filter-status="events" data-filter-noun="event"></p>
  <div class="grid" role="list">
    <div class="event" role="listitem" data-filter-item="events"><span class="event-tag" data-filter-value>Workshop</span><h3>Planning for retirement</h3></div>
    <div class="event" role="listitem" data-filter-item="events"><span class="event-tag" data-filter-value>Webinar</span><h3>Reading your statement</h3></div>
    <div class="event" role="listitem" data-filter-item="events"><span class="event-tag" data-filter-value>Workshop</span><h3>College savings basics</h3></div>
    <div class="event" role="listitem" data-filter-item="events"><span class="event-tag" data-filter-value>Seminar</span><h3>Estate planning 101</h3></div>
  </div>
</main>

<!-- In Webflow this goes in Site settings > Custom code > Footer code -->
<script src="webflow/filter-bar.js?v=phone-motion"></script>
</body>
</html>
