<!-- Advisor filter controls: paste into a Code Embed above the advisor Collection List -->
<style>
  /* Placeholder values: replace with your brand colors and spacing */
  .af {
    --af-white: #ffffff;
    --af-navy: #0b2f47;
    --af-ink: #13232e;
    --af-track: rgba(255, 255, 255, 0.12);
    --af-idle-text: rgba(255, 255, 255, 0.82);
    --af-placeholder: #56636c;
    --af-radius: 10px;
    --af-h: 44px;
    --af-inset: 3px;   /* must match INSET in the page script */
    --af-search-max: 400px;   /* widest the search field gets on desktop and iPad */
  }
  [hidden] { display: none !important; }
  .af-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* One shared track holds the search field and the segment */
  .af-controls { display: flex; flex-wrap: wrap; justify-content: space-between; box-sizing: border-box; column-gap: 12px; row-gap: 8px; padding: 8px; border-radius: var(--af-radius); background: var(--af-track); }
  .af-search { position: relative; flex: 1 1 240px; width: var(--af-search-max); max-width: var(--af-search-max); box-sizing: border-box; padding: var(--af-inset) 0 var(--af-inset) var(--af-inset); }
  .af-search svg { position: absolute; left: calc(var(--af-inset) + 12px); top: 50%; transform: translateY(-50%); color: var(--af-ink); pointer-events: none; }
  .af-search input {
    width: 100%; box-sizing: border-box; height: calc(var(--af-h) - 2 * var(--af-inset)); margin: 0;
    padding: 0 12px 0 40px;
    border: 0; border-radius: calc(var(--af-radius) - var(--af-inset));
    font: inherit; font-size: 16px; color: var(--af-ink); background: var(--af-white);
  }
  .af-search input::placeholder { color: var(--af-placeholder); }
  .af-search input:focus-visible { outline: 2px solid var(--af-ink); outline-offset: -4px; }

  /* Each filter is its label plus padding, no set width. 22px line + 8px top and bottom
     + 3px inset each side = 44px, the same height as --af-h. */
  .rs {
    position: relative; flex: 0 0 auto; min-width: 0; max-width: 100%; box-sizing: border-box;
    padding: var(--af-inset);
    border-radius: var(--af-radius);
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .rs:has(:focus-visible) { outline: 2px solid var(--af-white); outline-offset: -2px; }
  .rs-slots { display: flex; flex-wrap: wrap; }
  .rs button, .rs-thumb span {
    flex: 0 0 auto; display: grid; place-items: center; box-sizing: border-box; margin: 0;
    padding: 8px 24px;
    font: inherit; font-size: 15px; font-weight: 600; line-height: 22px; white-space: nowrap;
  }
  .rs button {
    border: 0; background: none; cursor: pointer; color: var(--af-idle-text);
    outline: none; -webkit-tap-highlight-color: transparent;
  }
  .rs-thumb { position: absolute; inset: 0; padding: var(--af-inset); box-sizing: border-box; background: var(--af-white); pointer-events: none; }
  .rs-thumb span { color: var(--af-navy); }
  .af-status { margin: 24px 0 16px; font-size: 15px; color: var(--af-idle-text); }
  .af-empty { margin: 0 0 16px; font-size: 17px; color: var(--af-white); }
  /* Stack below 720px so the row never wraps half-way (iPad portrait at 768px keeps one row) */
  @media (max-width: 719px) {
    .af-search { flex-basis: 100%; width: auto; max-width: none; padding: var(--af-inset) var(--af-inset) 0; }
    .af-search svg { top: calc(50% + var(--af-inset) / 2); }
    .rs { flex-basis: 100%; }
    /* Full-width row: smaller side padding to fit, then every filter grows by the same amount */
    .rs button, .rs-thumb span { flex-grow: 1; padding-left: 4px; padding-right: 4px; }
  }

  /* Equal card heights: wrapped name/title lines and extra teal-bar lines tuck the card body up over
     the photo's bottom edge. Needs data-card-photo, data-card-footer, data-card-home and
     data-card-fit attributes on your card (see steps). */
  [data-card-photo] { margin-bottom: calc(-1 * var(--extra, 0px)); }
  [data-card-photo] ~ * { position: relative; }
</style>

<div class="af">
  <div class="af-controls">
    <div class="af-search">
      <label for="advisorSearch" class="af-sr">Search advisors</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="advisorSearch" type="search" placeholder="Search by name or city" autocomplete="off">
    </div>
    <div class="rs" id="stateFilter" role="radiogroup" aria-label="Filter by state">
      <div class="rs-slots">
        <button type="button" role="radio" aria-checked="true" data-value="" tabindex="0">All</button>
      </div>
      <div class="rs-thumb rs-slots" aria-hidden="true"><span>All</span></div>
    </div>
  </div>
  <p class="af-status" id="resultsStatus" role="status"></p>
  <p class="af-empty" id="emptyState" hidden>No advisors match. Try a different name, city or state.</p>
</div>
