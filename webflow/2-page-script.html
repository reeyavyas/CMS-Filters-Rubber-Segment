<script>
// Advisor filter: paste into Page Settings > Custom Code > Before </body> tag
(() => {
  const seg = document.getElementById('stateFilter');
  if (!seg) return;
  // One slot per state that at least one advisor has (the cards' [data-state] text), A to Z; "All" stays first
  const slotRow = seg.querySelector('.rs-slots:not(.rs-thumb)'), thumbRow = seg.querySelector('.rs-thumb');
  const stateNames = [...new Set([...document.querySelectorAll('[data-advisor] [data-state]')].map(e => e.textContent.trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
  for (const name of stateNames) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = name; b.tabIndex = -1; b.dataset.value = name;
    b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
    slotRow.append(b);
    const label = document.createElement('span'); label.textContent = name;
    thumbRow.append(label);
  }

  const slots = [...seg.querySelectorAll('[role=radio]')];
  const thumb = seg.querySelector('.rs-thumb');
  const search = document.getElementById('advisorSearch');
  const cards = [...document.querySelectorAll('[data-advisor]')];
  const status = document.getElementById('resultsStatus');
  const empty = document.getElementById('emptyState');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const SQUASH = 3, DURATION = 420, GLIDE_MS = 150;
  // Thumb corners follow the CSS: track radius minus its inset
  const RADIUS = parseFloat(getComputedStyle(seg).borderTopLeftRadius) - parseFloat(getComputedStyle(seg).paddingTop);
  const EASE = 'cubic-bezier(.3,.7,.2,1)';
  let active = 0, anim = null, drag = null, suppressClick = false;   // slot 0 is "All"

  // The thumb is a full-size layer clipped to the active slot, so the active label shows through it.
  // Rects are sub-pixel (rounded offsets leave 1px gaps) and carry top and bottom, because filters
  // can wrap onto more than one line when there are many states.
  const segRect = () => seg.getBoundingClientRect();
  const box = i => {
    const s = slots[i].getBoundingClientRect(), o = segRect();
    return [s.left - o.left, s.right - o.left, s.top - o.top, s.bottom - o.top];
  };
  const sameLine = (a, b) => Math.abs(a[2] - b[2]) < 1;
  const clip = ([l, r, t, b]) => {
    const o = segRect();
    return `inset(${t}px ${o.width - r}px ${o.height - b}px ${l}px round ${RADIUS}px)`;
  };
  const current = () => {
    // Browsers shorten inset() when sides match, e.g. "inset(3px 121px round 7px)"
    const m = getComputedStyle(thumb).clipPath.match(/inset\(([^)]*?)(?:\s+round\b|\))/);
    if (!m) return null;
    const [t, r = t, b = t, l = r] = m[1].trim().split(/\s+/).map(parseFloat);
    const o = segRect();
    return [l, o.width - r, t, o.height - b];
  };

  function animateTo(frames) {
    anim?.cancel();
    thumb.style.clipPath = clip(frames.at(-1));
    if (reduceMotion.matches) return;
    const offsets = frames.length === 4 ? [0, .45, .8, 1] : [0, 1];
    anim = thumb.animate(frames.map((f, k) => ({ clipPath: clip(f), offset: offsets[k], easing: EASE })), { duration: DURATION });
  }

  function select(i) {
    const to = box(i), from = current() ?? to;
    slots.forEach((s, k) => {
      s.setAttribute('aria-checked', String(k === i));
      s.tabIndex = k === i ? 0 : -1;
    });
    const [l, r, t, b] = to, [fl, fr, ft, fb] = from;
    if (!sameLine(from, to)) {                // other line: stretch across both lines, then the far edge squashes and relaxes
      const down = t > ft;
      animateTo([from, [l, r, Math.min(t, ft), Math.max(b, fb)], down ? [l, r, t + SQUASH, b] : [l, r, t, b - SQUASH], to]);
    } else if (l > fl) {                      // stretch right, then the trailing edge lands past and relaxes
      animateTo([from, [fl, r, t, b], [l + SQUASH, r, t, b], to]);
    } else if (l < fl) {
      animateTo([from, [l, fr, t, b], [l, r - SQUASH, t, b], to]);
    } else {
      animateTo([from, to]);
    }
    active = i;
    applyFilters();
  }

  slots.forEach((s, k) => s.addEventListener('click', () => {
    if (!suppressClick && k !== active) select(k);
  }));

  seg.addEventListener('keydown', e => {
    const k = slots.indexOf(document.activeElement);
    if (k < 0) return;
    const next = { ArrowRight: k + 1, ArrowDown: k + 1, ArrowLeft: k - 1, ArrowUp: k - 1, Home: 0, End: slots.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    const n = (next + slots.length) % slots.length;
    select(n);
    slots[n].focus();
  });

  // Drag and flick the thumb along its own line
  seg.addEventListener('pointerdown', e => {
    suppressClick = false;
    const o = segRect(), x = e.clientX - o.left, y = e.clientY - o.top;
    const [l, r, t, b] = box(active);
    if (x < l || x > r || y < t || y > b) return;
    const line = slots.map((_, k) => k).filter(k => sameLine(box(k), box(active)));
    drag = { x0: e.clientX, l, w: r - l, t, b, line, moved: false, lastX: e.clientX, lastT: e.timeStamp, v: 0, id: e.pointerId };
  });
  seg.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved) {
      if (Math.abs(dx) < 4) return;
      drag.moved = true;
      seg.setPointerCapture(drag.id);
      anim?.cancel();
    }
    const min = box(drag.line[0])[0], max = box(drag.line.at(-1))[1] - drag.w;
    const l = Math.min(max, Math.max(min, drag.l + dx));
    thumb.style.clipPath = clip([l, l + drag.w, drag.t, drag.b]);
    const dt = e.timeStamp - drag.lastT;
    if (dt > 0) drag.v = (e.clientX - drag.lastX) / dt;
    drag.lastX = e.clientX; drag.lastT = e.timeStamp;
  });
  const endDrag = e => {
    const d = drag; drag = null;
    if (!d || !d.moved) return;
    suppressClick = true;                             // swallow the click that follows a drag, nothing later
    setTimeout(() => { suppressClick = false; });
    const v = e.timeStamp - d.lastT > 80 ? 0 : d.v;   // a pause before release cancels the flick
    const [l, r] = current();
    const projected = (l + r) / 2 + v * GLIDE_MS;
    const centre = k => { const [a, b] = box(k); return (a + b) / 2; };
    const best = d.line.reduce((p, k) => Math.abs(centre(k) - projected) < Math.abs(centre(p) - projected) ? k : p);
    select(best);
  };
  seg.addEventListener('pointerup', endDrag);
  seg.addEventListener('pointercancel', endDrag);

  thumb.style.clipPath = clip(box(active));
  new ResizeObserver(() => {
    anim?.cancel();
    thumb.style.clipPath = clip(box(active));
  }).observe(seg);

  // Equal card heights: every line past the first in the name or title ([data-card-fit]), and every
  // teal-bar line past the home office line, comes out of the photo instead of making the card taller
  const wrapExtra = el => {
    const range = document.createRange();
    range.selectNodeContents(el);
    const tops = [...range.getClientRects()].map(x => x.top).sort((a, b) => a - b);
    const lines = tops.filter((t, i) => i === 0 || t - tops[i - 1] > 2).length;
    const cs = getComputedStyle(el);
    const h = el.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    return lines > 1 ? h * (lines - 1) / lines : 0;
  };
  const fitCard = c => {
    if (c.hidden) return;
    let extra = 0;
    const foot = c.querySelector('[data-card-footer]'), home = c.querySelector('[data-card-home]');
    if (foot && home) extra += foot.getBoundingClientRect().bottom - home.getBoundingClientRect().bottom - parseFloat(getComputedStyle(foot).paddingBottom) + wrapExtra(home);
    c.querySelectorAll('[data-card-fit]').forEach(el => { extra += wrapExtra(el); });
    c.style.setProperty('--extra', Math.max(0, extra) + 'px');
  };
  const cardRO = new ResizeObserver(entries => entries.forEach(e => fitCard(e.target.closest('[data-advisor]'))));
  cards.forEach(c => c.querySelectorAll('[data-card-footer], [data-card-fit]').forEach(el => cardRO.observe(el)));

  // Filtering: reads data-state and data-search, which Webflow CMS bindings can output
  function matches(card, state, q) {
    const states = [...card.querySelectorAll('[data-state]')].map(s => s.textContent.trim());
    const text = [...card.querySelectorAll('[data-search]')].map(s => s.textContent).join(' ').toLowerCase();
    return (!state || states.includes(state)) && (!q || text.includes(q));
  }
  function applyFilters() {
    const state = slots[active].dataset.value;
    const raw = search.value.trim();
    let shown = 0;
    for (const c of cards) {
      const ok = matches(c, state, raw.toLowerCase());
      c.hidden = !ok;
      shown += ok;
    }
    status.textContent = `${shown} advisor${shown === 1 ? '' : 's'}${state ? ` in ${state}` : ''}${raw ? ` matching “${raw}”` : ''}`;
    empty.hidden = shown > 0;
  }
  search.addEventListener('input', applyFilters);
  applyFilters();
})();
</script>
